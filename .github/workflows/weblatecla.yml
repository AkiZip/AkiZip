name: Weblate PR CLA Notice

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  comment-cla-notice:
    if: github.actor == 'weblate' || contains(github.actor, 'weblate')
    runs-on: ubuntu-latest
    steps:
      - name: Comment on Weblate PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "This PR does not require signing the CLA. If the check shows that the CLA has not been signed, please ignore it."
            });
